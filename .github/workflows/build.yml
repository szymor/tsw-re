# Build and test the game on Linux and Windows (README: Build).
#
# Both builds run in an Arch Linux container, which has the SDL3 packages
# (sdl3, sdl3_image, sdl3_ttf, sdl3_mixer) the Ubuntu runners lack:
#   linux    the native build, its tests, the .tar.gz package
#   windows  the MinGW-w64 cross-build with the official SDL3 MinGW
#            archives (tools/build_windows.sh), its tests under wine, the
#            .zip package
#   windows-run  the zip on a real Windows runner: the game starts, draws
#            one frame (--screenshot) and exits
#   release  after all of them pass on master: the packages as the rolling
#            pre-release "continuous", replacing the previous one and its tag
#
# The packages are uploaded as they are (archive: false), not zipped again.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build tools and SDL3
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja \
              sdl3 sdl3_image sdl3_ttf sdl3_mixer
      - uses: actions/checkout@v7
      - name: Build
        run: |
          # Help > About shows the commit (tools/commit_header.cmake).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          TSW_NO_AUDIO: '1'
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack --config CPackConfig.cmake
      - uses: actions/upload-artifact@v7
        with:
          path: build/tsw-re-*.tar.gz
          archive: false
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # The container runs as root, but $HOME (/github/home) belongs to the
      # runner's user, and wine refuses to keep its prefix there.
      WINEPREFIX: /tmp/wineprefix
    steps:
      - name: Install MinGW-w64, wine and the build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja curl \
              mingw-w64-gcc wine
      - uses: actions/checkout@v7
      - name: Cache the SDL3 MinGW archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/tsw/mingw
          key: sdl3-mingw-${{ hashFiles('tools/build_windows.sh') }}
      - name: Build, test under wine, package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/build_windows.sh test package
      - uses: actions/upload-artifact@v7
        with:
          path: build-windows/tsw-re-*.zip
          archive: false
          if-no-files-found: error

  windows-run:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tsw-re-*-windows-*.zip
          merge-multiple: true
          skip-decompress: true
      - name: Start the game and draw one frame
        shell: pwsh
        env:
          SDL_VIDEODRIVER: offscreen
          TSW_NO_AUDIO: '1'
        run: |
          Expand-Archive -Path (Get-Item tsw-re-*.zip) -DestinationPath out
          $dir = (Get-ChildItem out -Directory | Select-Object -First 1).FullName
          $p = Start-Process -FilePath "$dir\tsw-re.exe" -Wait -PassThru `
              -ArgumentList '--no-intro', '--save-dir', "$env:RUNNER_TEMP", `
                            '--screenshot', "$env:RUNNER_TEMP\shot.png"
          if ($p.ExitCode -ne 0) { throw "tsw-re.exe exited with $($p.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw 'no screenshot' }

  release:
    needs: [linux, windows, windows-run]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time; a run whose commit is no longer master's head
    # leaves the release to the newer run.
    concurrency:
      group: release-continuous
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tsw-re-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Replace the continuous pre-release
        run: |
          head=$(gh api "repos/$GH_REPO/commits/master" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
              echo "master is at $head now; leaving the release to its run"
              exit 0
          fi
          ls -l dist
          short=${GITHUB_SHA:0:7}
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous dist/* \
              --target "$GITHUB_SHA" --prerelease \
              --title "Latest build ($short)" \
              --notes "Built automatically from $short, the last commit on master whose build and tests all passed. Each new build replaces this pre-release. Linux: needs the SDL3 libraries (sdl3, sdl3_image, sdl3_ttf, sdl3_mixer). Windows: unzip and run tsw-re.exe (Windows 10 or later)."
